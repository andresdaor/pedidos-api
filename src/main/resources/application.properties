spring.application.name=pedidos-api

# H2 en memoria (base de datos embebida para desarrollo)
spring.datasource.url=jdbc:h2:mem:pedidosdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Consola H2 disponible en /h2-console (solo desarrollo)
spring.h2.console.enabled=true

# Actuator: exponemos el health check que el pipeline va a usar
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
